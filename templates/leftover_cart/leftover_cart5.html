<!doctype html>
<html lang="id" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=720" />
        <title>Barang impianmu nungguin lho!</title>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </head>
    <body style="margin:0;padding:0;background:#ffffff;font-family:Nunito,Arial,Helvetica,sans-serif;color:#111827;-webkit-text-size-adjust:none;text-size-adjust:none;">
        <table role="presentation" width="720" cellspacing="0" cellpadding="0" align="center"
               style="width:720px;min-width:720px;margin:0 auto;border-collapse:collapse;table-layout:fixed;background:#fdfdfd;">
        <tr><td style="padding:0 0 28px;">

            <!-- ── TOP NAV BAR ── -->
            <table role="presentation" width="720" cellspacing="0" cellpadding="0" style="width:720px;border-collapse:collapse;background:#ff4b0a;border-radius:0 0 24px 24px;">
            <tr><td style="padding:0 34px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
                <tr>
                    <td valign="middle" style="padding:22px 0 18px;">
                        <a href="https://kyou.id/" style="display:inline-block;border:0;text-decoration:none;">
                            <img src="https://kyoucdn.id/static/assets/brand_logo.png" alt="Kyou.id" width="64"
                                 style="display:block;width:64px;height:auto;border:0;" />
                        </a>
                    </td>
                    <td valign="middle" align="right" style="padding:22px 0 18px;">
                        <a href="https://kyou.id/user/cart" style="color:#ffffff;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style="vertical-align:-3px;margin-right:4px;"><path d="m20 2.7-.4-.2H3.8L3.3.3Q3.3.1 3 0H.4Q0 0 0 .4t.4.4h2.2l2 10.2a3 3 0 0 0 2.8 2.3H17q.4 0 .4-.4t-.4-.4H7.5a2 2 0 0 1-1.7-.9L18 9.9l.3-.3L20 2.9zm-2.4 6.5L5.4 10.8 4 3.3H19zM7 14.2a2 2 0 0 0-2.1 2c0 1.2 1 2.1 2 2.1a2 2 0 0 0 2.2-2A2 2 0 0 0 7 14.2m0 3.3q-1.2-.2-1.3-1.2.1-1.4 1.3-1.3t1.2 1.3c.1 1.2-.6 1.2-1.2 1.2m8.3-3.3a2 2 0 0 0-2 2q.1 2 2 2.1a2 2 0 0 0 2.1-2 2 2 0 0 0-2-2.1m0 3.3q-1.1-.2-1.2-1.2c-.1-1 .6-1.3 1.2-1.3q1.2.1 1.3 1.3c0 1.2-.6 1.2-1.3 1.2"></path></svg>KERANJANGMU</a>
                    </td>
                </tr>
                </table>
            </td></tr>
            </table>

            <!-- ── HERO TEXT ── -->
            <table role="presentation" width="720" cellspacing="0" cellpadding="0" style="width:720px;border-collapse:collapse;">
            <tr><td style="padding:36px 76px 28px;text-align:center;">
                <div style="display:inline-block;background:#fff3e0;color:#c2410c;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:6px 18px;border-radius:24px;border:1px solid #ffc6ad;margin:0 0 18px;">
                    HALO, {{ .FirstName }}
                </div>
                <div style="color:#2b2b2b;font-size:30px;font-weight:900;line-height:1.25;letter-spacing:-0.5px;margin:0 0 14px;">
                    Rakmu lagi nyimpenin sesuatu
                </div>
                <p style="margin:0;font-size:15px;font-weight:700;color:#5f6368;line-height:1.7;">
                    Barang-barang di bawah ini masih sabar menunggu kamu untuk dijemput.
                </p>
            </td></tr>
            </table>

            <!-- ── CART PANEL ── -->
            <table role="presentation" width="720" cellspacing="0" cellpadding="0" style="width:720px;border-collapse:collapse;">
            <tr><td style="padding:0 28px 36px;">
                {{ .CartHTML }}
            </td></tr>
            </table>

            {{ if .RecoHTML }}
            <!-- ── RECOMMENDATION PANEL ── -->
            <table role="presentation" width="720" cellspacing="0" cellpadding="0" style="width:720px;border-collapse:collapse;">
            <tr><td style="padding:0 28px 36px;">
                {{ .RecoHTML }}
            </td></tr>
            </table>
            {{ end }}

            {{ .FooterHTML }}

        </td></tr>
        </table>
    </body>
</html>

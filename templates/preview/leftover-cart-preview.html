<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leftover Cart Templates Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #cbd5e1; font-family: Arial, sans-serif; }
    .wrapper { padding: 32px 20px; }
    .section { margin-bottom: 48px; }
    .label { text-align: center; padding: 0 0 10px; font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 2px; text-transform: uppercase; }
    iframe { display: block; margin: 0 auto; border: none; width: 720px; background: #fff; }
    .placeholder { width: 720px; margin: 0 auto; padding: 40px; background: #f1f5f9; border: 2px dashed #cbd5e1; text-align: center; color: #94a3b8; font-size: 14px; border-radius: 8px; }
  </style>
  <script>
    function resizeIframe(el) {
      try { el.style.height = el.contentDocument.body.scrollHeight + 'px'; } catch(e) {}
    }
  </script>
</head>
<body>
<div class="wrapper">
  <div class="section">
    <div class="label">Template 1 &mdash; leftover_cart1.html</div>
    <iframe src="leftover-cart1-preview.html" onload="resizeIframe(this)" scrolling="no"></iframe>
  </div>
  <div class="section">
    <div class="label">Template 2 &mdash; leftover_cart2.html</div>
    <iframe src="leftover-cart2-preview.html" onload="resizeIframe(this)" scrolling="no"></iframe>
  </div>
  <div class="section">
    <div class="label">Template 3 &mdash; leftover_cart3.html</div>
    <iframe src="leftover-cart3-preview.html" onload="resizeIframe(this)" scrolling="no"></iframe>
  </div>
  <div class="section">
    <div class="label">Template 4 &mdash; leftover_cart4.html</div>
    <iframe src="leftover-cart4-preview.html" onload="resizeIframe(this)" scrolling="no"></iframe>
  </div>
  <div class="section">
    <div class="label">Template 5 &mdash; leftover_cart5.html</div>
    <iframe src="leftover-cart5-preview.html" onload="resizeIframe(this)" scrolling="no"></iframe>
  </div>
</div>
</body>
</html>

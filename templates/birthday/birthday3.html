<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyou.id birthday voucher</title>
</head>
<body style="margin:0;background:#eef2ff;font-family:Arial,Helvetica,sans-serif;color:#111827;">
  <div style="max-width:640px;margin:0 auto;padding:28px 16px;">
    <div style="background:#ffffff;border:1px solid #c7d2fe;border-radius:8px;">
      <div style="padding:28px 28px 0 28px;">
        <p style="margin:0 0 8px 0;color:#4338ca;font-size:13px;font-weight:700;">BIRTHDAY RECOMMENDATION</p>
        <h1 style="margin:0 0 12px 0;font-size:26px;line-height:1.25;">Happy birthday, {{ .Name }}.</h1>
        <p style="margin:0 0 22px 0;line-height:1.6;color:#4b5563;">Ini voucher dan pilihan item yang cocok buat checkout ulang tahunmu.</p>
      </div>
      <div style="padding:0 28px 28px 28px;">
        <div style="border:1px solid #c7d2fe;background:#eef2ff;border-radius:8px;padding:18px;margin-bottom:24px;">
          <p style="margin:0 0 6px 0;font-size:13px;color:#4338ca;">Birthday voucher</p>
          <p style="margin:0;font-size:24px;font-weight:700;">{{ .VoucherCode }}</p>
        </div>
        <table role="presentation" style="width:100%;border-collapse:collapse;">
          <tr>
            <td style="vertical-align:top;padding:0 0 20px 0;">
              <h2 style="font-size:17px;margin:0 0 10px 0;">Wishlist</h2>
              {{ .WishlistHTML }}
            </td>
          </tr>
          <tr>
            <td style="vertical-align:top;padding:0 0 24px 0;">
              <h2 style="font-size:17px;margin:0 0 10px 0;">FYP</h2>
              {{ .FYPHTML }}
            </td>
          </tr>
        </table>
        <a href="{{ .ActionURL }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:6px;font-weight:700;">Buka Kyou.id</a>
        <p style="margin:24px 0 0 0;color:#4b5563;">{{ .Closing }}</p>
      </div>
    </div>
  </div>
</body>
</html>
